# Builds the VitePress site and deploys it to GitHub Pages.
#
# THIS FILE BELONGS TO THE MIRROR, NOT TO THE SOURCE REPO.
# It lives here as the master copy; add it to
# SI679-public/SI679-public.github.io by hand.
#
# publish.mjs only ever touches site/ and code/, so this file is outside its
# reach and will not be deleted by a publish. That is structural, not a
# safeguard someone has to maintain.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
